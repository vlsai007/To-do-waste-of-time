<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Some thing for You ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
      background-image: radial-gradient(#222 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Courier New', monospace;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    .phone-screen {
      width: 90%;
      max-width: 380px;
      height: 85vh;
      max-height: 680px;
      background: #181818;
      border-radius: 40px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
      padding: 28px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform 0.5s ease-in-out, box-shadow 0.5s ease-in-out;
      animation: floatEffect 5s infinite ease-in-out;
      border: 1px solid rgba(255, 50, 50, 0.2);
    }

    .phone-screen:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 15px 40px rgba(255, 0, 0, 0.75);
    }

    .letter-container {
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      color: #ff6666;
      scrollbar-width: none;
    }

    .letter-container::-webkit-scrollbar {
      display: none;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.1rem;
      vertical-align: middle;
      background: #ff6666;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes floatEffect {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    .heart {
      position: absolute;
      color: #ff3344;
      opacity: 0.8;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      animation: floatHearts linear infinite;
    }

    @keyframes floatHearts {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-300px) scale(1.2);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .phone-screen {
        width: 92%;
        height: 80vh;
        padding: 22px;
      }
      .letter-container {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="phone-screen">
    <div class="letter-container" id="letter">
      <span id="text"></span><span class="cursor"></span>
    </div>
  </div>

  <script>
    const letterText = `To you ,


💖`;

    let index = 0;

    function typeLetter() {
      if (index < letterText.length) {
        document.getElementById("text").innerHTML += letterText[index];
        index++;
        setTimeout(typeLetter, 70);
      }
    }

    setTimeout(typeLetter, 1000);

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "💖";
      document.body.appendChild(heart);

      const x = Math.random() * window.innerWidth;
      const size = Math.random() * 20 + 15;
      const duration = Math.random() * 3 + 3;

      heart.style.left = `${x}px`;
      heart.style.bottom = "0px";
      heart.style.fontSize = `${size}px`;
      heart.style.animationDuration = `${duration}s`;

      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    setInterval(createHeart, 450);
  </script>
</body>
</html>
